# ~/.config/kitty/kitty.conf — "Shinobi" GPU terminal: matte black, 100 % opaque, green text.
# Same palette as the GNOME Terminal profile. Reload live: ctrl+shift+F5.

# ── Font (Nerd Font: starship / eza / fastfetch icons) ─────────────────────────
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures cursor

# ── Opacity: NONE ──────────────────────────────────────────────────────────────
background_opacity 1.0
dynamic_background_opacity no
background_blur 0

# ── Colors: deep matte black + high-readability green ─────────────────────────
background            #0a0d0a
foreground            #50fa7b
selection_background  #1f5f33
selection_foreground  #e8ffe8
cursor                #50fa7b
cursor_text_color     #0a0d0a
url_color             #8be9fd
active_border_color   #50fa7b
inactive_border_color #1c2a1f

# 16-color palette (normal / bright)
color0  #0a0d0a
color8  #4d5a50
color1  #ff5555
color9  #ff6e6e
color2  #50fa7b
color10 #69ff94
color3  #f1fa8c
color11 #ffffa5
color4  #6fa8ff
color12 #9cc4ff
color5  #bd93f9
color13 #d6acff
color6  #8be9fd
color14 #a4ffff
color7  #c8d3c8
color15 #f8f8f2

# ── Tabs ───────────────────────────────────────────────────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_background   #50fa7b
active_tab_foreground   #0a0d0a
inactive_tab_background #111711
inactive_tab_foreground #50fa7b
tab_bar_background      #050705

# ── Window ─────────────────────────────────────────────────────────────────────
window_padding_width 8
wayland_titlebar_color background
confirm_os_window_close 0
# Keep kitty's shell integration but not its window-title hook: that hook warns at every
# start because ~/.bashrc uses HISTCONTROL=ignoreboth (which we keep).
shell_integration no-title
enable_audio_bell no
visual_bell_duration 0

# ── Performance: low input latency, no wasted frames ───────────────────────────
repaint_delay 8
input_delay 2
sync_to_monitor yes
scrollback_lines 10000

# ── Cursor / mouse ─────────────────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0.6
cursor_stop_blinking_after 10
copy_on_select clipboard
